name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-gate:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - dmd-latest
          - ldc-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Unit tests
        shell: bash
        run: dub test --force

      - name: Public API contract
        shell: bash
        run: tools/validate-api.sh

      - name: Documentation contract
        if: matrix.compiler == 'dmd-latest'
        shell: bash
        run: tools/validate-docs.sh

      - name: Release build
        shell: bash
        run: dub build --build=release --force
