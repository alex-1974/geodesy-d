name: UPS platform matrix

on:
  workflow_dispatch:

  push:
    branches:
      - develop
    paths:
      - "source/geodesy/projection/ups.d"
      - "source/geodesy/projection/polar_stereographic.d"
      - "validation/ups_*"
      - "docs/UPS_POLICY.md"
      - ".github/workflows/ups-platform-matrix.yml"

  pull_request:
    branches:
      - develop
      - main
    paths:
      - "source/geodesy/projection/ups.d"
      - "source/geodesy/projection/polar_stereographic.d"
      - "validation/ups_*"
      - "docs/UPS_POLICY.md"
      - ".github/workflows/ups-platform-matrix.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 / LDC 1.41.0
            os: ubuntu-24.04
            compiler: ldc-1.41.0
            experimental: false
          - name: Linux AArch64 / LDC 1.41.0
            os: ubuntu-24.04-arm
            compiler: ldc-1.41.0
            experimental: false
          - name: Windows x86_64 / LDC 1.41.0
            os: windows-2025
            compiler: ldc-1.41.0
            experimental: false
          - name: macOS AArch64 / LDC 1.41.0
            os: macos-15
            compiler: ldc-1.41.0
            experimental: false
          - name: macOS x86_64 / LDC 1.41.0
            os: macos-15-intel
            compiler: ldc-1.41.0
            experimental: false
          - name: Linux x86_64 / DMD 2.111.0
            os: ubuntu-24.04
            compiler: dmd-2.111.0
            experimental: false
          - name: Windows AArch64 / LDC 1.41.0
            os: windows-11-arm
            compiler: ldc-1.41.0
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Toolchain
        shell: bash
        run: |
          set -euxo pipefail
          "$DC" --version
          dub --version

      - name: Library unit tests
        shell: bash
        run: dub test --compiler="$DC"

      - name: UPS scalar / boundary qualification
        shell: bash
        run: |
          set -euxo pipefail
          "$DC" -i -Isource -run validation/ups_scalar_validation.d

  compiler:
    name: compiler / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - dmd-2.112.1
          - dmd-2.113.0
          - ldc-1.41.0
          - ldc-1.42.0
          - ldc-1.43.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler
        shell: bash
        run: |
          "$DC" --version
          dub --version

      - name: Unit tests
        shell: bash
        run: dub test --compiler="$DC"

      - name: UPS scalar / boundary qualification
        shell: bash
        run: |
          set -euxo pipefail
          "$DC" -i -Isource -run validation/ups_scalar_validation.d

      - name: Release build
        shell: bash
        run: dub build --build=release --compiler="$DC"
