name: Release compiler and consumer gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "source/**"
      - "validation/api/**"
      - "tools/validate-api.sh"
      - "tools/validate-release-consumer.sh"
      - "dub.sdl"
      - ".github/workflows/release-compiler-consumer.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compiler-consumer:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - dmd-2.112.1
          - dmd-2.113.0
          - ldc-1.41.0
          - ldc-1.42.0
          - ldc-1.43.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Unit tests
        shell: bash
        run: dub test --force

      - name: Release build
        shell: bash
        run: dub build --build=release --force

      - name: Public API contract
        shell: bash
        run: tools/validate-api.sh

      - name: External DUB consumer
        shell: bash
        run: bash tools/validate-release-consumer.sh
