name: Geodesic nearest-point differential validation

on:
  pull_request:
    paths:
      - "source/geodesy/geodesic_nearest.d"
      - "validation/geodesic_nearest_*"
      - ".github/workflows/geodesic-nearest-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Checkout GeographicLib 2.7
        uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build GeographicLib 2.7
        shell: bash
        run: |
          cmake -S geographiclib -B geographiclib-build             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7"             -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build

      - name: Build and run differential validation
        shell: bash
        env:
          DC: ${{ startsWith(matrix.compiler, 'dmd') && 'dmd' || 'ldc2' }}
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          g++ -O2 -std=c++17             -I"$RUNNER_TEMP/geographiclib-2.7/include"             -c validation/geodesic_nearest_reference.cpp             -o "$tmp/reference.o"
          "$DC" -release -O -i -Isource             validation/geodesic_nearest_differential.d             "$tmp/reference.o"             -L-L"$RUNNER_TEMP/geographiclib-2.7/lib"             -L-lGeographicLib -L-lstdc++             -of="$tmp/validation"
          LD_LIBRARY_PATH="$RUNNER_TEMP/geographiclib-2.7/lib:${LD_LIBRARY_PATH:-}"             stdbuf -oL -eL "$tmp/validation"
